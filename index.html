<!doctype html><html lang="th"><head><meta name="viewport" content="width=device-width,initial-scale=1"><meta charset="utf-8"><title>Object Scan — ทดลองเก็บภาพ</title><style>body{margin:0;background:#101822;color:#f4f7fa;font:16px system-ui}main{max-width:760px;margin:auto;padding:20px}h1{font-size:1.6rem}video{width:100%;aspect-ratio:4/3;background:#222;object-fit:contain;border-radius:12px}button{border:0;border-radius:10px;padding:14px;margin:5px;background:#28b3a3;color:#071b1a;font-weight:bold}button:disabled{opacity:.4}.box{background:#202d3b;padding:14px;border-radius:10px;margin:12px 0}#photos{display:flex;gap:8px;overflow:auto}img{height:90px;border-radius:6px}</style></head><body><main><h1>ทดลองสแกนวัตถุ</h1><p>เก็บภาพจากกล้องหลายมุมสำหรับนำไปสร้างโมเดล 3 มิติ</p><div class="box">ต้นแบบนี้เก็บภาพเท่านั้น ยังไม่ได้สร้างโมเดลหรือ Point Cloud</div><video id="video" playsinline muted autoplay></video><div><button id="start">เปิดกล้อง</button><button id="capture" disabled>เริ่มเก็บภาพอัตโนมัติ</button><button id="stop" disabled>หยุดเก็บภาพ</button><button id="download" disabled>ดาวน์โหลดภาพ</button></div><p id="status" role="status">รอเปิดกล้อง · ภาพ 0 รูป</p><div id="photos"></div><p>เดินรอบวัตถุช้า ๆ เก็บภาพซ้อนกัน และถ่ายจากหลายระดับ · ไฟล์ภาพอยู่ในหน้านี้จนกว่าจะดาวน์โหลดหรือปิดหน้าเว็บ</p></main><script>
const v=document.querySelector('#video'),start=document.querySelector('#start'),capture=document.querySelector('#capture'),stop=document.querySelector('#stop'),download=document.querySelector('#download'),status=document.querySelector('#status'),photos=document.querySelector('#photos');let stream=null,timer=null,frames=[];
start.onclick=async()=>{try{if(!navigator.mediaDevices?.getUserMedia)throw Error('เปิดกล้องได้เมื่อใช้ HTTPS หรือ localhost');stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'}},audio:false});v.srcObject=stream;await v.play();capture.disabled=false;status.textContent='กล้องพร้อมใช้งาน · ภาพ '+frames.length+' รูป'}catch(e){status.textContent='เปิดกล้องไม่ได้: '+e.message}};
async function take(){if(!v.videoWidth||frames.length>=150){if(frames.length>=150)stop.click();return}const c=document.createElement('canvas');c.width=v.videoWidth;c.height=v.videoHeight;c.getContext('2d').drawImage(v,0,0);const b=await new Promise(r=>c.toBlob(r,'image/jpeg',.88));if(!b)return;frames.push(b);let im=document.createElement('img');im.src=URL.createObjectURL(b);im.alt='ภาพที่ '+frames.length;photos.append(im);status.textContent='เก็บภาพแล้ว '+frames.length+' รูป';download.disabled=false}
capture.onclick=()=>{capture.disabled=true;stop.disabled=false;take();timer=setInterval(take,2000)};stop.onclick=()=>{clearInterval(timer);timer=null;stop.disabled=true;capture.disabled=false;status.textContent='หยุดเก็บภาพ · '+frames.length+' รูป'};download.onclick=async()=>{for(let i=0;i<frames.length;i++){let a=document.createElement('a');a.href=URL.createObjectURL(frames[i]);a.download='object_'+String(i+1).padStart(3,'0')+'.jpg';a.click();await new Promise(r=>setTimeout(r,180))}status.textContent='ส่งคำสั่งดาวน์โหลด '+frames.length+' ภาพแล้ว โปรดตรวจสิทธิ์ดาวน์โหลดในเบราว์เซอร์'};window.addEventListener('pagehide',()=>{clearInterval(timer);stream?.getTracks().forEach(t=>t.stop())});
</script></body></html>
